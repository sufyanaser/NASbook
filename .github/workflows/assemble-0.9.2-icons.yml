name: Assemble NASbook 0.9.2 icons

on:
  push:
    branches:
      - release/0.9.2-icons
    paths:
      - ".github/workflows/assemble-0.9.2-icons.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.9.2-icons
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Import verified 0.9.2 files from develop
        shell: pwsh
        run: |
          git fetch origin develop
          $paths = @(
            'src/shared/categoryIcons.ts',
            'src/renderer/components/CategoryCustomizationDialog.tsx',
            'src/renderer/styles/category-customization.css',
            'tests/scaffold.test.mjs',
            'docs/RELEASE_0.9.2.md',
            'package.json',
            'public/category-icons/adaptive/star.svg',
            'public/category-icons/adaptive/bookmark.svg',
            'public/category-icons/adaptive/briefcase.svg',
            'public/category-icons/adaptive/calendar.svg',
            'public/category-icons/adaptive/microphone.svg',
            'public/category-icons/adaptive/radio.svg',
            'public/category-icons/adaptive/music.svg',
            'public/category-icons/adaptive/image.svg',
            'public/category-icons/adaptive/database.svg',
            'public/category-icons/adaptive/cloud.svg',
            'public/category-icons/adaptive/shield.svg',
            'public/category-icons/adaptive/rocket.svg',
            'public/category-icons/adaptive/target.svg',
            'public/category-icons/adaptive/palette.svg',
            'public/category-icons/adaptive/lightbulb.svg',
            'public/category-icons/adaptive/archive-box.svg',
            'public/category-icons/colored/star.svg',
            'public/category-icons/colored/bookmark.svg',
            'public/category-icons/colored/briefcase.svg',
            'public/category-icons/colored/calendar.svg',
            'public/category-icons/colored/microphone.svg',
            'public/category-icons/colored/radio.svg',
            'public/category-icons/colored/music.svg',
            'public/category-icons/colored/image.svg',
            'public/category-icons/colored/database.svg',
            'public/category-icons/colored/cloud.svg',
            'public/category-icons/colored/shield.svg',
            'public/category-icons/colored/rocket.svg',
            'public/category-icons/colored/target.svg',
            'public/category-icons/colored/palette.svg',
            'public/category-icons/colored/lightbulb.svg',
            'public/category-icons/colored/archive-box.svg'
          )
          foreach ($path in $paths) {
            git checkout origin/develop -- $path
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to import $path"
            }
          }

      - name: Install dependencies
        run: npm ci

      - name: Synchronize release version
        run: npm version 0.9.2 --no-git-tag-version --allow-same-version

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        shell: pwsh
        run: git rm .github/workflows/assemble-0.9.2-icons.yml

      - name: Commit clean release branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public tests docs package.json package-lock.json .github/workflows
          git commit -m "feat: add 24 NASbook category icons"
          git push origin HEAD:release/0.9.2-icons
