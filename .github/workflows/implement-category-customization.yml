name: Implement category customization

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/implement-category-customization.yml"

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply category customization feature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("src/shared/categoryIcons.ts").write_text(r'''import type { CategorySlug } from "./categories";

export type CategoryIconKey =
  | "notes"
  | "folder"
  | "broadcast"
  | "home"
  | "person"
  | "code"
  | "warning"
  | "grid";

export interface CategoryIconChoice {
  readonly key: CategoryIconKey;
  readonly fileName: string;
  readonly labelAr: string;
  readonly labelEn: string;
}

export const categoryIconChoices: readonly CategoryIconChoice[] = [
  { key: "notes", fileName: "all-notes.svg", labelAr: "ملاحظات", labelEn: "Notes" },
  { key: "folder", fileName: "projects.svg", labelAr: "مجلد", labelEn: "Folder" },
  { key: "broadcast", fileName: "channels.svg", labelAr: "قناة", labelEn: "Channel" },
  { key: "home", fileName: "nas.svg", labelAr: "رئيسي", labelEn: "Home" },
  { key: "person", fileName: "personal.svg", labelAr: "شخصي", labelEn: "Personal" },
  { key: "code", fileName: "development.svg", labelAr: "تطوير", labelEn: "Development" },
  { key: "warning", fileName: "errors.svg", labelAr: "تنبيه", labelEn: "Warning" },
  { key: "grid", fileName: "templates.svg", labelAr: "قوالب", labelEn: "Templates" },
] as const;

export const customizableCategorySlugs = [
  "prompts",
  "chatgpt-instructions",
  "nas-projects",
  "powershell-commands",
  "development-notes",
  "errors-fixes",
  "templates",
] as const satisfies readonly CategorySlug[];

const fileByIconKey = Object.fromEntries(
  categoryIconChoices.map((choice) => [choice.key, choice.fileName]),
) as Record<CategoryIconKey, string>;

const legacyIconFiles: Readonly<Record<string, string>> = {
  "notebook-tabs": "all-notes.svg",
  "message-square-code": "projects.svg",
  "shield-alert": "channels.svg",
  "folder-git-2": "nas.svg",
  terminal: "personal.svg",
  "code-2": "development.svg",
  bug: "errors.svg",
  "layout-template": "templates.svg",
  archive: "archive.svg",
  "trash-2": "trash.svg",
};

const fallbackIconFiles: Readonly<Partial<Record<CategorySlug, string>>> = {
  "all-notes": "all-notes.svg",
  prompts: "projects.svg",
  "chatgpt-instructions": "channels.svg",
  "nas-projects": "nas.svg",
  "powershell-commands": "personal.svg",
  "development-notes": "development.svg",
  "errors-fixes": "errors.svg",
  templates: "templates.svg",
  archive: "archive.svg",
  trash: "trash.svg",
};

const defaultKeyBySlug: Readonly<Partial<Record<CategorySlug, CategoryIconKey>>> = {
  prompts: "folder",
  "chatgpt-instructions": "broadcast",
  "nas-projects": "home",
  "powershell-commands": "person",
  "development-notes": "code",
  "errors-fixes": "warning",
  templates: "grid",
};

export function isCategoryIconKey(value: string): value is CategoryIconKey {
  return Object.prototype.hasOwnProperty.call(fileByIconKey, value);
}

export function resolveCategoryIconFile(
  icon: string | undefined,
  slug: CategorySlug,
): string {
  if (icon && isCategoryIconKey(icon)) {
    return fileByIconKey[icon];
  }

  if (icon && legacyIconFiles[icon]) {
    return legacyIconFiles[icon];
  }

  return fallbackIconFiles[slug] ?? "projects.svg";
}

export function resolveCategoryIconKey(
  icon: string | undefined,
  slug: CategorySlug,
): CategoryIconKey {
  if (icon && isCategoryIconKey(icon)) {
    return icon;
  }

  return defaultKeyBySlug[slug] ?? "folder";
}
''', encoding="utf-8")

          Path("src/renderer/components/CategoryCustomizationDialog.tsx").write_text(r'''import { useEffect, useState } from "react";
import { createPortal } from "react-dom";

import type { CategoryRecord } from "../../shared/categories";
import {
  categoryIconChoices,
  resolveCategoryIconKey,
  type CategoryIconKey,
} from "../../shared/categoryIcons";
import type { UpdateCategoryInput } from "../../shared/ipc";
import type { AppLanguage, RailIconMode } from "../../shared/settings";
import "../styles/category-customization.css";

interface CategoryCustomizationDialogProps {
  readonly category: CategoryRecord | null;
  readonly language: AppLanguage;
  readonly railIconMode: RailIconMode;
  readonly onClose: () => void;
  readonly onSave: (input: UpdateCategoryInput) => Promise<void>;
}

const iconAssetPath = (mode: RailIconMode, fileName: string): string =>
  `${import.meta.env.BASE_URL}category-icons/${mode}/${fileName}`;

export function CategoryCustomizationDialog({
  category,
  language,
  railIconMode,
  onClose,
  onSave,
}: CategoryCustomizationDialogProps): JSX.Element | null {
  const [name, setName] = useState("");
  const [icon, setIcon] = useState<CategoryIconKey>("folder");
  const [isSaving, setIsSaving] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    if (!category) {
      return;
    }

    setName(category.name);
    setIcon(resolveCategoryIconKey(category.icon, category.slug));
    setError("");
    setIsSaving(false);
  }, [category]);

  useEffect(() => {
    if (!category) {
      return undefined;
    }

    const handleKeyDown = (event: KeyboardEvent): void => {
      if (event.key === "Escape" && !isSaving) {
        onClose();
      }
    };

    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [category, isSaving, onClose]);

  if (!category) {
    return null;
  }

  const isArabic = language === "ar";

  const handleSubmit = async (event: React.FormEvent<HTMLFormElement>): Promise<void> => {
    event.preventDefault();
    const normalizedName = name.trim();

    if (!normalizedName) {
      setError(isArabic ? "اكتب اسم المجلد." : "Enter a folder name.");
      return;
    }

    setIsSaving(true);
    setError("");

    try {
      await onSave({ id: category.id, name: normalizedName, icon });
      onClose();
    } catch (saveError) {
      console.error("Failed to update category:", saveError);
      setError(isArabic ? "تعذر حفظ التعديلات." : "Unable to save changes.");
      setIsSaving(false);
    }
  };

  return createPortal(
    <div
      className="category-customization-overlay"
      role="presentation"
      onMouseDown={(event) => {
        if (event.target === event.currentTarget && !isSaving) {
          onClose();
        }
      }}
    >
      <form
        className="category-customization-dialog"
        dir={isArabic ? "rtl" : "ltr"}
        onSubmit={(event) => void handleSubmit(event)}
      >
        <div className="category-customization-header">
          <div>
            <h2>{isArabic ? "تخصيص المجلد" : "Customize folder"}</h2>
            <p>
              {isArabic
                ? "غيّر الاسم واختر أيقونة محفوظة داخل NASbook."
                : "Rename the folder and choose a built-in NASbook icon."}
            </p>
          </div>
          <button
            aria-label={isArabic ? "إغلاق" : "Close"}
            className="category-customization-close"
            disabled={isSaving}
            onClick={onClose}
            type="button"
          >
            ×
          </button>
        </div>

        <label className="category-customization-field">
          <span>{isArabic ? "اسم المجلد" : "Folder name"}</span>
          <input
            autoFocus
            maxLength={40}
            onChange={(event) => setName(event.target.value)}
            value={name}
          />
        </label>

        <fieldset className="category-customization-icons">
          <legend>{isArabic ? "الأيقونة" : "Icon"}</legend>
          <div className="category-customization-icon-grid">
            {categoryIconChoices.map((choice) => {
              const selected = choice.key === icon;
              const src = iconAssetPath(railIconMode, choice.fileName);

              return (
                <button
                  aria-label={isArabic ? choice.labelAr : choice.labelEn}
                  className="category-customization-icon-button"
                  data-selected={selected ? "true" : "false"}
                  key={choice.key}
                  onClick={() => setIcon(choice.key)}
                  title={isArabic ? choice.labelAr : choice.labelEn}
                  type="button"
                >
                  {railIconMode === "colored" ? (
                    <img alt="" src={src} />
                  ) : (
                    <span
                      className="category-customization-icon-mask"
                      style={{ "--category-icon-url": `url(${src})` } as React.CSSProperties}
                    />
                  )}
                </button>
              );
            })}
          </div>
        </fieldset>

        {error && <p className="category-customization-error" role="alert">{error}</p>}

        <div className="category-customization-actions">
          <button
            className="category-customization-secondary"
            disabled={isSaving}
            onClick={onClose}
            type="button"
          >
            {isArabic ? "إلغاء" : "Cancel"}
          </button>
          <button
            className="category-customization-primary"
            disabled={isSaving}
            type="submit"
          >
            {isSaving
              ? isArabic ? "جارٍ الحفظ..." : "Saving..."
              : isArabic ? "حفظ" : "Save"}
          </button>
        </div>
      </form>
    </div>,
    document.body,
  );
}
''', encoding="utf-8")

          Path("src/renderer/styles/category-customization.css").write_text(r'''.category-customization-overlay {
