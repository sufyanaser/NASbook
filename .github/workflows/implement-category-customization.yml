  cursor: pointer;
  transition: opacity 120ms ease, color 120ms ease, background 120ms ease;
}

.rail-category-row:hover .rail-category-edit,
.rail-category-edit:focus-visible {
  opacity: 1;
}

.rail-category-edit:hover {
  color: var(--app-text-strong);
