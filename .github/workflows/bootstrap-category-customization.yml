name: Bootstrap category customization

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-category-customization.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and run implementation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/implement-category-customization.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          embedded = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          Path('/tmp/apply_category_customization.py').write_text(script + "\n", encoding='utf-8')
          PY
          python /tmp/apply_category_customization.py

      - name: Install dependencies
        run: npm ci

      - name: Set version 0.9.1
        run: npm version 0.9.1 --no-git-tag-version --allow-same-version

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit and push feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron src tests package.json package-lock.json
          git commit -m "feat: customize primary category names and icons"
          git push origin develop
