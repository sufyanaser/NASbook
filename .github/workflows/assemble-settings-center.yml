name: Assemble NASbook Settings Center

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.head.ref == 'feature/settings-center-gmail-backup' && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/settings-center-gmail-backup
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply backend integration patch
        run: python scripts/apply_settings_center_backend.py

      - name: Install dependencies
        run: npm ci

      - name: Set version 0.10.0
        run: npm version 0.10.0 --no-git-tag-version --allow-same-version

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary assembly files
        shell: pwsh
        run: |
          git rm scripts/apply_settings_center_backend.py
          git rm .github/workflows/assemble-settings-center.yml

      - name: Commit verified feature
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: centralize settings and add Gmail backup"
          git push origin HEAD:feature/settings-center-gmail-backup
