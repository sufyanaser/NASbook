name: Apply code block palette 16

on:
  push:
    branches:
      - fix/v04-code-block-palette-16

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v04-code-block-palette-16
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize target line endings
        shell: pwsh
        run: |
          $paths = @(
            "src/renderer/components/NoteEditorArea.tsx",
            "src/renderer/styles/index.css"
          )
          foreach ($path in $paths) {
            $content = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n")
            [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($false))
          }

      - name: Apply palette fix
        run: node scripts/apply-code-block-palette-16.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Remove temporary applicator
        shell: pwsh
        run: |
          Remove-Item "scripts/apply-code-block-palette-16.mjs" -Force
          Remove-Item ".github/workflows/apply-code-block-palette-16.yml" -Force

      - name: Commit validated fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: expand code block palette to sixteen colors"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
