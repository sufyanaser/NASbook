name: Apply editor productivity features

on:
  push:
    branches:
      - feature/editor-productivity-lock-collapse-contrast

permissions:
  contents: write

concurrency:
  group: editor-productivity-feature-apply
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/editor-productivity-lock-collapse-contrast
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preflight applicator
        run: node scripts/preflight-editor-productivity-applicator.mjs

      - name: Apply guarded source changes
        run: node scripts/apply-editor-productivity-features.mjs

      - name: Remove temporary applicator files
        run: |
          rm -f scripts/apply-editor-productivity-features.mjs
          rm -f scripts/preflight-editor-productivity-applicator.mjs
          rm -f .github/workflows/apply-editor-productivity-features.yml

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add note lock collapsible sections and smart contrast"
          git push origin HEAD:feature/editor-productivity-lock-collapse-contrast
