name: Bug report
description: Report a reproducible NASbook failure.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use sample content only. Do not attach real notes, databases, OAuth credentials, or tokens.
  - type: input
    id: version
    attributes:
      label: NASbook version
      placeholder: V08 / 8.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options: [Editor, RTL or LTR, Autosave, Search, Categories, Backup, Google Drive, Automatic update, Startup or close, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps using sample data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private notes, database contents, credentials, and tokens.
          required: true
